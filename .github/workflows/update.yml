name: Update clean list

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [filter.py, allow.txt, block.txt]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python filter.py
      - name: Save the new list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pb repo.json removed.txt
          if git diff --cached --quiet; then
            echo "No change upstream"
          else
            git commit -m "update: follow the Keiyoushi list"
            git push
          fi
