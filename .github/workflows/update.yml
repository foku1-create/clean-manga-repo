name: Update clean list

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, allow.txt, block.txt, block-tags.txt, blocked.png, "guard/**", "tools/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guarded extensions
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_KEY_PASSWORD: ${{ secrets.CLEAN_KEY_PASSWORD }}
          CLEAN_KEYSTORE_B64: ${{ secrets.CLEAN_KEYSTORE_B64 }}
        run: |
          echo "$CLEAN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          python build.py --keystore "$RUNNER_TEMP/keystore.p12"
          rm -f "$RUNNER_TEMP/keystore.p12"
      - name: Save the new list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pb repo.json removed.txt guard.json
          if git diff --cached --quiet; then
            echo "No change upstream"
          else
            git commit -m "update: follow the Keiyoushi list"
            git push
          fi
